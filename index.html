<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonah & The Whale</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Lexend+Exa:wght@100..900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-deep: #02040a;
            --accent-blue: #3b82f6;
            --glass-white: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: #f8fafc;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .font-lexend {
            font-family: 'Lexend Exa', sans-serif;
        }

        .glass-morphism {
            background: rgba(8, 12, 24, 0.6);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        @keyframes subtle-float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(10px, -20px);
            }
        }

        .animate-subtle-float {
            animation: subtle-float 15s ease-in-out infinite;
        }

        @keyframes light-rays {

            0%,
            100% {
                opacity: 0.3;
                transform: rotate(0deg) scale(1);
            }

            50% {
                opacity: 0.5;
                transform: rotate(5deg) scale(1.1);
            }
        }

        .ray {
            animation: light-rays 20s ease-in-out infinite;
        }

        /* Utility to hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom scrollbar for vertical elements */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb,
        [class*="bg-[#02040a]"] .custom-scrollbar::-webkit-scrollbar-thumb,
        [class*="glass-morphism"] .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover,
        [class*="bg-[#02040a]"] .custom-scrollbar::-webkit-scrollbar-thumb:hover,
        [class*="glass-morphism"] .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",

  }
}
</script>

</head>

</html>
